services:
  coordinator:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DAASH_DATABASE_URL=postgresql://daash:daash@db:5432/daash
      - DAASH_ALEMBIC_DATABASE_URL=postgresql+psycopg://daash:daash@db:5432/daash
      - DAASH_REDIS_URL=redis://redis:6379/0
      - DAASH_DATABASE_HOST=db
      - DAASH_LLM_ENDPOINT=http://host.docker.internal:12345
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - daash-data:/var/lib/postgresql/data

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: daash
      POSTGRES_PASSWORD: daash
      POSTGRES_DB: daash
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daash"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  dashboard:
    image: node:26-alpine
    working_dir: /app
    environment:
      - VITE_API_PROXY_TARGET=http://coordinator:8000
    volumes:
      - ./dashboard:/app
      - dashboard-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - coordinator

volumes:
  pg-data:
  daash-data:
  dashboard-node-modules:
