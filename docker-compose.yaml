services:
  coordinator:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DAASH_DATABASE_URL=postgresql://daash:daash@db:5432/daash
      - DAASH_ALEMBIC_DATABASE_URL=postgresql+psycopg://daash:daash@db:5432/daash
      - DAASH_REDIS_URL=redis://redis:6379/0
      - DAASH_DATABASE_HOST=db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - daash-data:/var/lib/postgresql/data

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: daash
      POSTGRES_PASSWORD: daash
      POSTGRES_DB: daash
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daash"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg-data:
  daash-data:
