# Networks:
#   backend  - internal (no egress, no published ports): db, redis, coordinator, engine, test.
#              PostgreSQL and Redis are reachable only from containers on this network.
#   frontend - regular bridge: coordinator, engine and dashboard. Carries the published ports,
#              the dashboard's /api proxy to the coordinator, npm installs, and the
#              coordinator's egress to the LLM endpoint on the host.
# Published ports bind to 127.0.0.1 by default (set DAASH_BIND_ADDR=0.0.0.0, or a Tailscale IP, to
# let runners on other devices reach the coordinator; then ALSO set DAASH_API_TOKEN):
#   8000 - coordinator API (docs at /docs)
#   7173 - DAASHboard (Vite dev server)
services:
  coordinator:
    build:
      context: .
      target: runtime
    ports:
      - "${DAASH_BIND_ADDR:-127.0.0.1}:8000:8000"
    environment:
      - DAASH_DATABASE_URL=postgresql://daash:daash@db:5432/daash
      - DAASH_ALEMBIC_DATABASE_URL=postgresql+psycopg://daash:daash@db:5432/daash
      - DAASH_REDIS_URL=redis://redis:6379/0
      - DAASH_DATABASE_HOST=db
      - DAASH_LLM_ENDPOINT=${DAASH_LLM_ENDPOINT:-http://m3u512gb.tail391a32.ts.net:12345}
      - DAASH_LLM_API_KEY=${DAASH_LLM_API_KEY:-}
      - DAASH_LLM_MAX_CONCURRENCY=${DAASH_LLM_MAX_CONCURRENCY:-4}
      - DAASH_LLM_MODEL_CONCURRENCY=${DAASH_LLM_MODEL_CONCURRENCY:-{}}
      - DAASH_WORKSPACE_ROOT=/workspaces
      - DAASH_API_TOKEN=${DAASH_API_TOKEN:-}
      - DAASH_RUNNER_BOOTSTRAP_TOKEN=${DAASH_RUNNER_BOOTSTRAP_TOKEN:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - daash-workspaces:/workspaces
    networks:
      - backend
      - frontend

  # The engine drives the agents (python -m app.engine). Same image as the coordinator;
  # shares the workspaces volume. Needs the frontend network for LLM gateway egress.
  engine:
    build:
      context: .
      target: runtime
    command: ["engine"]
    restart: unless-stopped
    environment:
      - DAASH_DATABASE_URL=postgresql://daash:daash@db:5432/daash
      - DAASH_REDIS_URL=redis://redis:6379/0
      - DAASH_DATABASE_HOST=db
      - DAASH_LLM_ENDPOINT=${DAASH_LLM_ENDPOINT:-http://m3u512gb.tail391a32.ts.net:12345}
      - DAASH_LLM_API_KEY=${DAASH_LLM_API_KEY:-}
      - DAASH_LLM_MAX_CONCURRENCY=${DAASH_LLM_MAX_CONCURRENCY:-4}
      - DAASH_LLM_MODEL_CONCURRENCY=${DAASH_LLM_MODEL_CONCURRENCY:-{}}
      - DAASH_WORKSPACE_ROOT=/workspaces
      - DAASH_ENGINE_ENABLED=${DAASH_ENGINE_ENABLED:-true}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      coordinator:
        condition: service_healthy
    volumes:
      - daash-workspaces:/workspaces
    networks:
      - backend
      - frontend

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: daash
      POSTGRES_PASSWORD: daash
      POSTGRES_DB: daash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daash"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    networks:
      - backend

  dashboard:
    image: node:26-alpine
    working_dir: /app
    environment:
      - VITE_API_PROXY_TARGET=http://coordinator:8000
    volumes:
      - ./dashboard:/app
      - dashboard-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:7173:7173"
    depends_on:
      - coordinator
    networks:
      - frontend

  # DAASH runner (docs/DESIGN-0.3.md section 7, docs/RUNNER.md): runs the external agent CLIs
  # (OpenClaude, Claude Code, Codex) inside this container so agent-executed code stays off the host.
  # Not started by default: `docker compose --profile runner up --build -d runner`.
  # Needs DAASH_RUNNER_BOOTSTRAP_TOKEN set for the coordinator too (the same value) and DAASH_LLM_API_KEY.
  runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: Dockerfile.runner
    restart: unless-stopped
    environment:
      - DAASH_COORDINATOR_URL=http://coordinator:8000
      - DAASH_RUNNER_TOKEN=${DAASH_RUNNER_BOOTSTRAP_TOKEN:-}
      - DAASH_LLM_API_KEY=${DAASH_LLM_API_KEY:-}
      - DAASH_RUNNER_MAX_JOBS=${DAASH_RUNNER_MAX_JOBS:-2}
    volumes:
      - runner-work:/work
    networks:
      - frontend

  # Unit tests: `docker compose --profile test run --rm --build test`.
  # Fast and isolated: no database, Redis or network (docs/DESIGN-0.1.md §11).
  # Integration tests have their own service (`integration`); e2e: scripts/e2e.sh.
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      - DAASH_TEST_DATABASE_URL=postgresql://daash:daash@db:5432/daash_test
      - DAASH_TEST_REDIS_URL=redis://redis:6379/15
    network_mode: none

  # Integration tests: `docker compose --profile integration run --rm --build integration`
  # (docs/DESIGN-0.2.md A.2). Real PostgreSQL (database daash_test, created and migrated per
  # session) and real Redis (DB 15); the API and the engine run in-process against an
  # in-process scripted fake LLM (tests/fakes). No published ports.
  integration:
    profiles: ["integration"]
    build:
      context: .
      target: test
    command: ["python", "-m", "pytest", "tests/integration", "-q"]
    environment:
      - DAASH_TEST_DATABASE_URL=postgresql://daash:daash@db:5432/daash_test
      - DAASH_TEST_REDIS_URL=redis://redis:6379/15
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    internal: true
  frontend:

volumes:
  pg-data:
  daash-workspaces:
  dashboard-node-modules:
  runner-work:
